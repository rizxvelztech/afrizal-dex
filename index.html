/* ===== LOADING SCREEN ===== */
#loadingScreen {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: #0a0a0a;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.8s ease;
  font-family: 'Poppins', sans-serif;
}
#loadingScreen.hide {
  opacity: 0;
  pointer-events: none;
}
.loading-bg {
  position: absolute;
  inset: 0;
  overflow: hidden;
}
.loading-bg-circle {
  position: absolute;
  border-radius: 9999px;
  filter: blur(90px);
}
.loading-bg-circle:nth-child(1) {
  top: -20%;
  left: -10%;
  width: 300px;
  height: 300px;
  background: rgba(99, 102, 241, 0.3);
  animation: floatBlur 6s ease-in-out infinite;
}
.loading-bg-circle:nth-child(2) {
  bottom: -20%;
  right: -10%;
  width: 300px;
  height: 300px;
  background: rgba(255, 255, 255, 0.15);
  animation: floatBlur 8s ease-in-out infinite reverse;
}
.loading-bg-circle:nth-child(3) {
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 400px;
  height: 400px;
  background: rgba(139, 92, 246, 0.1);
  animation: floatBlur 10s ease-in-out infinite;
}
@keyframes floatBlur {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(30px, -30px) scale(1.1); }
  66% { transform: translate(-20px, 20px) scale(0.9); }
}
.loading-grid {
  position: absolute;
  inset: 0;
  background-image: linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
}
.loading-content {
  text-align: center;
  position: relative;
  z-index: 1;
  padding: 2rem;
}
.loading-logo {
  width: 80px;
  height: 80px;

  align-items: center;
  justify-content: center;

  font-weight: 800;
  font-size: 28px;
  color: white;
  animation: logoPulse 2s ease-in-out infinite;
}
@keyframes logoPulse {

  50% { transform: scale(1.05); }
}
.loading-logo span:last-child {
  background: linear-gradient(135deg, #fff, #9ca3af);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.loading-title {
  font-weight: 700;
  font-size: 2.5rem;
  color: white;
}
@media (min-width: 768px) {
  .loading-title { font-size: 3.5rem; }
}
.loading-title .highlight {
  background: linear-gradient(135deg, #ffffff, #9ca3af);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.loading-typing {
  color: #d1d5db;
  font-size: 1.1rem;
  font-weight: 600;
  margin-top: 0.5rem;
}
.loading-typing-cursor {
  display: inline-block;
  width: 3px;
  height: 1.2em;
  background: #fff;
  margin-left: 4px;
  animation: blink 0.8s step-end infinite;
  vertical-align: text-bottom;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}
.loading-sub {
  color: #9ca3af;
  margin-top: 0.5rem;

@keyframes fadeUp {

  to { opacity: 1; transform: translateY(0); }
}
.loading-icons {

  gap: 1.5rem;
  margin-top: 2rem;
  opacity: 0;

.loading-icon {

.loading-icon:nth-child(1) { animation-delay: 0s; }

.loading-icon:nth-child(3) { animation-delay: 0.8s; }

.loading-bar {

body.loading { overflow: hidden; }

(function() {
  const loadingScreen = document.getElementById('loadingScreen');
  const mainContent = document.getElementById('mainContent');
  const percentEl = document.getElementById('loadingPercent');
  const textEl = document.getElementById('loadingText');
  const cursorEl = document.getElementById('loadingCursor');
  
  const words = ["Developer", "Programmer", "Developer & Programmer"];
  let wordIndex = 0;
  let charIndex = 0;
  let isDeleting = false;
  let percent = 0;

  function typeEffect() {
    const currentWord = words[wordIndex];
    if (isDeleting) {
      textEl.textContent = currentWord.substring(0, charIndex - 1);
      charIndex--;
    } else {
      textEl.textContent = currentWord.substring(0, charIndex + 1);
      charIndex++;
    }

    let delay = isDeleting ? 40 : 80;

    if (!isDeleting && charIndex === currentWord.length) {
      delay = 1000;
      isDeleting = true;
    } else if (isDeleting && charIndex === 0) {
      isDeleting = false;
      wordIndex = (wordIndex + 1) % words.length;
      delay = 300;
    }

    setTimeout(typeEffect, delay);
  }

  function updatePercent() {
    if (percent < 100) {
      percent += Math.random() * 3 + 1;
      if (percent > 100) percent = 100;
      percentEl.textContent = Math.floor(percent) + '%';
      setTimeout(updatePercent, 80 + Math.random() * 60);
    } else {
      setTimeout(() => {
        loadingScreen.classList.add('hide');
        document.body.classList.remove('loading');
        mainContent.style.display = 'block';
        document.body.style.overflow = '';
