<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: 'Inter', sans-serif;
  background: #0a0a0a;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.loading-container {
  text-align: center;
  padding: 2rem;
  position: relative;
}
.bg-blur {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}
.bg-blur-circle {
  position: absolute;
  border-radius: 9999px;
  filter: blur(90px);
  pointer-events: none;
}
.bg-blur-circle:nth-child(1) {
  top: -20%;
  left: -10%;
  width: 300px;
  height: 300px;
  background: rgba(99, 102, 241, 0.3);
  animation: floatBlur 6s ease-in-out infinite;
}
.bg-blur-circle:nth-child(2) {
  bottom: -20%;
  right: -10%;
  width: 300px;
  height: 300px;
  background: rgba(255, 255, 255, 0.15);
  animation: floatBlur 8s ease-in-out infinite reverse;
}
.bg-blur-circle:nth-child(3) {
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 400px;
  height: 400px;
  background: rgba(139, 92, 246, 0.1);
  animation: floatBlur 10s ease-in-out infinite;
}
@keyframes floatBlur {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(30px, -30px) scale(1.1); }
  66% { transform: translate(-20px, 20px) scale(0.9); }
}
.bg-grid {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-image: 
    linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}
.loading-content {
  position: relative;
  z-index: 1;
}
.logo-box {
  width: 80px;
  height: 80px;
  margin: 0 auto 1.5rem;
  border-radius: 24px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Poppins', sans-serif;
  font-weight: 800;
  font-size: 28px;
  color: white;
  backdrop-filter: blur(10px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  transition: all 0.3s ease;
  animation: logoPulse 2s ease-in-out infinite;
}
@keyframes logoPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
  50% { transform: scale(1.05); box-shadow: 0 8px 48px rgba(255,255,255,0.08); }
}
.logo-box span:first-child {
  color: #fff;
}
.logo-box span:last-child {
  background: linear-gradient(135deg, #fff, #9ca3af);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.welcome-text {
  font-family: 'Poppins', sans-serif;
  font-weight: 700;
  font-size: 2.5rem;
  color: white;
  margin-bottom: 0.5rem;
  letter-spacing: -0.02em;
}
@media (min-width: 768px) {
  .welcome-text {
    font-size: 3.5rem;
  }
}
.welcome-text .highlight {
  background: linear-gradient(135deg, #ffffff, #9ca3af);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.typing-container {
  display: inline-block;
  position: relative;
}
.typing-text {
  display: inline-block;
  font-weight: 700;
}
.typing-cursor {
  display: inline-block;
  width: 3px;
  height: 1.2em;
  background: #ffffff;
  margin-left: 4px;
  animation: blink 0.8s step-end infinite;
  vertical-align: text-bottom;
  border-radius: 2px;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}
.sub-text {
  color: #9ca3af;
  font-size: 1rem;
  margin-top: 0.5rem;
  opacity: 0;
  animation: fadeInUp 0.6s ease forwards;
  animation-delay: 2.5s;
}
@media (min-width: 768px) {
  .sub-text {
    font-size: 1.25rem;
  }
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.tech-icons {
  display: flex;
  justify-content: center;
  gap: 1.5rem;
  margin-top: 2rem;
  opacity: 0;
  animation: fadeInUp 0.6s ease forwards;
  animation-delay: 3s;
}
.tech-icon {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.06);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  color: #d1d5db;
  transition: all 0.3s ease;
  animation: iconFloat 3s ease-in-out infinite;
}
.tech-icon:nth-child(1) { animation-delay: 0s; }
.tech-icon:nth-child(2) { animation-delay: 0.4s; }
.tech-icon:nth-child(3) { animation-delay: 0.8s; }
.tech-icon:nth-child(4) { animation-delay: 1.2s; }
.tech-icon:nth-child(5) { animation-delay: 1.6s; }

.tech-icon:hover {
  transform: translateY(-4px) scale(1.1);
  border-color: rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.08);
}
.tech-icon .fab.fa-js {
  color: #f7df1e;
}
.tech-icon .fab.fa-html5 {
  color: #e34f26;
}
.tech-icon .fab.fa-css3-alt {
  color: #1572b6;
}
.tech-icon .fab.fa-react {
  color: #61dafb;
}
.tech-icon .fab.fa-github {
  color: #ffffff;
}
@keyframes iconFloat {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-6px); }
}
.loading-bar {
  width: 200px;
  height: 2px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 2px;
  margin: 2rem auto 0;
  overflow: hidden;
  opacity: 0;
  animation: fadeInUp 0.6s ease forwards;
  animation-delay: 2.8s;
}
.loading-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #ffffff, #9ca3af);
  border-radius: 2px;
  animation: fillBar 2s ease-in-out forwards;
  animation-delay: 0.5s;
}
@keyframes fillBar {
  0% { width: 0%; }
  100% { width: 100%; }
}
.loading-percent {
  color: #9ca3af;
  font-size: 0.75rem;
  font-weight: 500;
  margin-top: 0.5rem;
  opacity: 0;
  animation: fadeInUp 0.6s ease forwards;
  animation-delay: 3s;
}
</style>
</head>
<body>

<div class="bg-blur">
  <div class="bg-blur-circle"></div>
  <div class="bg-blur-circle"></div>
  <div class="bg-blur-circle"></div>
</div>
<div class="bg-grid"></div>

<div class="loading-container">
  <div class="loading-content">
    
    <div class="logo-box">
      <span>D</span><span>x</span>
    </div>

    <div class="welcome-text">
      Welcome to<br>
      <span class="highlight">My Portfolio</span>
    </div>

    <div style="margin-top: 0.5rem;">
      <span class="typing-text" id="typingText"></span>
      <span class="typing-cursor" id="cursor">|</span>
    </div>

    <p class="sub-text">Loading your experience...</p>

    <div class="tech-icons">
      <div class="tech-icon"><i class="fab fa-js"></i></div>
      <div class="tech-icon"><i class="fab fa-html5"></i></div>
      <div class="tech-icon"><i class="fab fa-css3-alt"></i></div>
      <div class="tech-icon"><i class="fab fa-react"></i></div>
      <div class="tech-icon"><i class="fab fa-github"></i></div>
    </div>

    <div class="loading-bar">
      <div class="loading-bar-fill"></div>
    </div>
    <div class="loading-percent" id="percentText">0%</div>

  </div>
</div>

<script>
const text = "Developer & Programmer";
const typingElement = document.getElementById('typingText');
const cursorElement = document.getElementById('cursor');
const percentElement = document.getElementById('percentText');
let index = 0;
let percent = 0;

function typeText() {
  if (index < text.length) {
    typingElement.textContent += text.charAt(index);
    index++;
    setTimeout(typeText, 60 + Math.random() * 40);
  } else {
    setTimeout(() => {
      cursorElement.style.opacity = '0';
    }, 500);
  }
}

function updatePercent() {
  if (percent < 100) {
    percent += Math.random() * 3 + 1;
    if (percent > 100) percent = 100;
    percentElement.textContent = Math.floor(percent) + '%';
    setTimeout(updatePercent, 80 + Math.random() * 60);
  } else {
    setTimeout(() => {
      window.location.href = 'portofolio.html';
    }, 600);
  }
}

setTimeout(typeText, 500);
setTimeout(updatePercent, 800);
</script>

</body>
</html>
